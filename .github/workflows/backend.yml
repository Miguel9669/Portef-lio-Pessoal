name: Backend

on:
  pull_request:
  push:
    branches: [main, dev, stage, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cobertura mínima de linhas, em percentagem.
  COBERTURA_MINIMA: 80

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet build --no-restore --configuration Release
      - name: Migrações em dia com o modelo
        run: |
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            --project src/Portfolio.Infrastructure --startup-project src/Portfolio.Infrastructure \
            --context BackofficeDbContext
      # Inclui os testes da base de dados (Testcontainers); no CI falham se não houver Docker.
      - name: Testes com cobertura
        run: |
          dotnet test --no-build --configuration Release \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      # Ficam de fora o código gerado (migrações, OpenAPI) e a fábrica usada só pelo `dotnet ef`.
      - name: Relatório de cobertura
        run: |
          dotnet reportgenerator \
            -reports:"tests/**/TestResults/coverage.cobertura.xml" \
            -targetdir:cobertura \
            -reporttypes:"JsonSummary;MarkdownSummaryGithub;Html" \
            -assemblyfilters:"+Portfolio.*;-Portfolio.Tests" \
            -classfilters:"-Microsoft.AspNetCore.OpenApi.Generated*;-System.*;-*.BackofficeDbContextFactory" \
            -filefilters:"-*/Migracoes/*"
          cat cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Cobertura mínima
        run: |
          cobertura=$(jq '.summary.linecoverage' cobertura/Summary.json)
          echo "Cobertura de linhas: ${cobertura}% (mínimo ${COBERTURA_MINIMA}%)"
          if (( $(echo "$cobertura < $COBERTURA_MINIMA" | bc -l) )); then
            echo "::error::Cobertura de ${cobertura}% abaixo do mínimo de ${COBERTURA_MINIMA}%"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: backend/cobertura
          if-no-files-found: ignore

  base-de-dados:
    # Arranca o PostgreSQL do docker-compose e confirma as permissões dos utilizadores (SEG01).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arrancar o PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Verificar permissões
        run: ./docker/postgres/verificar-permissoes.sh
      - name: Registos do PostgreSQL
        if: failure()
        run: docker compose logs postgres
