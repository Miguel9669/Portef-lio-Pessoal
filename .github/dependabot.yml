# Atualizações automáticas de dependências (SEG28).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend/backoffice
    schedule:
      interval: weekly
    # Só versões com pelo menos 14 dias (proteção contra pacotes comprometidos).
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
